<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tilcara Legends — Estado de Cuota</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-oscuro:#0e1f16;
    --verde-panel:#152a1f;
    --dorado:#c9a24b;
    --dorado-claro:#e6c878;
    --dorado-opaco:#8a6f2f;
    --text:#ece4d2;
    --muted:#9fae9f;

    --al-dia:#3c8a4a;
    --leve:#c9a24b;
    --moderado:#c9772f;
    --importante:#a13d33;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Cinzel', serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(201,162,75,0.06), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px),
      linear-gradient(160deg, #0a1710 0%, var(--verde-oscuro) 45%, #0c1a13 100%);
    min-height:100vh;
    padding:0 0 40px 0;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:48px 24px 36px;
    text-align:center;
    border-bottom:1px solid var(--dorado-opaco);
    overflow:hidden;
  }
  .hero::before, .hero::after{
    content:"";
    position:absolute; top:0; height:2px; width:60%;
    background:linear-gradient(90deg, transparent, var(--dorado), transparent);
  }
  .hero::before{ left:-10%; }
  .hero::after{ right:-10%; }

  .crest{ margin:0 auto 14px; display:block; }

  .club{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:3px;
    font-size:.85rem;
    color:var(--dorado-claro);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .legends{
    font-family:'Great Vibes', cursive;
    font-size:3.4rem;
    line-height:1;
    background:linear-gradient(180deg, var(--dorado-claro), var(--dorado) 55%, var(--dorado-opaco));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:4px 0;
  }
  .subtitulo{
    font-size:.75rem;
    letter-spacing:4px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .subtitulo span{ color:var(--dorado); padding:0 10px; }

  /* ---------- CONTENT ---------- */
  .contenido{ max-width:1100px; margin:0 auto; padding:32px 20px 0; }
  .contenido h2{
    font-size:1rem; letter-spacing:2px; text-transform:uppercase;
    color:var(--dorado-claro); margin-bottom:2px; text-align:center;
  }
  .contenido p.sub{
    color:var(--muted); text-align:center; font-family:system-ui,sans-serif;
    font-size:.85rem; margin-top:0; margin-bottom:28px;
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .card{
    background:linear-gradient(160deg, var(--verde-panel), #0f1e16);
    border:1px solid rgba(201,162,75,0.25);
    border-top:2px solid var(--linea, #555);
    border-radius:4px;
    padding:18px;
    position:relative;
  }
  .card.verde{ --linea:var(--al-dia); }
  .card.amarillo{ --linea:var(--leve); }
  .card.naranja{ --linea:var(--moderado); }
  .card.rojo{ --linea:var(--importante); }

  .nombre{
    font-family:system-ui,sans-serif;
    font-weight:600; margin-bottom:6px; font-size:.95rem; color:var(--text);
  }
  .estado{
    font-family:system-ui,sans-serif;
    font-size:.78rem; color:var(--muted); margin-bottom:12px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .barra-bg{background:rgba(255,255,255,0.06); border-radius:6px; height:6px; overflow:hidden;}
  .barra{height:100%; border-radius:6px;}
  .barra.verde{background:var(--al-dia);}
  .barra.amarillo{background:var(--leve);}
  .barra.naranja{background:var(--moderado);}
  .barra.rojo{background:var(--importante);}

  #loading, #error{
    text-align:center; color:var(--muted); font-family:system-ui,sans-serif;
    padding:20px;
  }
</style>
</head>
<body>

<div class="hero">
  <img class="crest" src="https://res.cloudinary.com/dy9zeeo5g/image/upload/v1775063479/lbwk2ikigsjombr6nrmu.png" width="90" alt="Escudo Club Tilcara Legends">
  
</div>

<div class="contenido">
  <h2>Estado de Cuota</h2>
  <p class="sub">No se muestran montos ni fechas exactas.</p>

  <div id="loading">Cargando...</div>
  <div id="error" style="display:none;"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
  // Pegá acá la URL de tu Web App de Apps Script (termina en /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbPnNjcWdnwzgWBx-OP3hXq7Z7lEVrTapWfVzgSpeK04N5NfeFlsXd8a5ZVBHoqP4m-Q/exec';

  async function cargar() {
    try {
      // GET simple, sin headers custom -> evita problemas de CORS/preflight
      const res = await fetch(APPS_SCRIPT_URL + '?categoria=VETERANOS-%20RUGBY');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const datos = await res.json();
      renderizar(datos);
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = 'No se pudo cargar el padrón: ' + err.message;
    }
  }

  function renderizar(datos) {
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    datos.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card ' + d.color;
      card.innerHTML = `
        <div class="nombre">${d.nombre}</div>
        <div class="estado">${d.estado}</div>
        <div class="barra-bg"><div class="barra ${d.color}" style="width:${d.score}%"></div></div>
      `;
      grid.appendChild(card);
    });
  }

  cargar();
</script>
</body>
</html>
