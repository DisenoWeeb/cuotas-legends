<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tilcara Legends — Estado de Cuota Societaria</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Vista previa al compartir (WhatsApp / redes) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Estado de Cuota Societaria — Tilcara Legends">
<meta property="og:description" content="Consultá el estado de tu cuota societaria de Veteranos de Rugby.">
<meta property="og:image" content="https://res.cloudinary.com/dy9zeeo5g/image/upload/b_rgb:0e1f16,w_1200,h_630,c_pad/v1775063479/lbwk2ikigsjombr6nrmu.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Estado de Cuota Societaria — Tilcara Legends">
<meta name="twitter:description" content="Consultá el estado de tu cuota societaria de Veteranos de Rugby.">
<meta name="twitter:image" content="https://res.cloudinary.com/dy9zeeo5g/image/upload/b_rgb:0e1f16,w_1200,h_630,c_pad/v1775063479/lbwk2ikigsjombr6nrmu.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-oscuro:#0e1f16;
    --verde-panel:#152a1f;
    --dorado:#c9a24b;
    --dorado-claro:#e6c878;
    --dorado-opaco:#8a6f2f;
    --text:#ece4d2;
    --muted:#9fae9f;

    --al-dia:#3c8a4a;
    --leve:#c9a24b;
    --moderado:#c9772f;
    --importante:#a13d33;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{
    margin:0; font-family:'Cinzel', serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(201,162,75,0.06), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px),
      linear-gradient(160deg, #0a1710 0%, var(--verde-oscuro) 45%, #0c1a13 100%);
    min-height:100vh;
    padding:0 0 40px 0;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:48px 24px 36px;
    text-align:center;
    border-bottom:1px solid var(--dorado-opaco);
    overflow:hidden;
  }
  .hero::before, .hero::after{
    content:"";
    position:absolute; top:0; height:2px; width:60%;
    background:linear-gradient(90deg, transparent, var(--dorado), transparent);
    transform:scaleX(0);
    animation:trazo-dorado 1.1s ease-out .2s forwards;
  }
  .hero::before{ left:-10%; transform-origin:left; }
  .hero::after{ right:-10%; transform-origin:right; }

  @keyframes trazo-dorado{ to{ transform:scaleX(1); } }

  .crest{
    margin:0 auto 14px; display:block;
    opacity:0; transform:translateY(-14px) scale(.92);
    animation:escudo-entrada .9s cubic-bezier(.2,.8,.2,1) .1s forwards;
    filter:drop-shadow(0 0 0 rgba(201,162,75,0));
    transition:filter .4s ease;
  }
  .crest:hover{ filter:drop-shadow(0 0 14px rgba(201,162,75,0.45)); }

  @keyframes escudo-entrada{ to{ opacity:1; transform:translateY(0) scale(1); } }

  .club{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:3px;
    font-size:.85rem;
    color:var(--dorado-claro);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .legends{
    font-family:'Great Vibes', cursive;
    font-size:3.4rem;
    line-height:1;
    background:linear-gradient(180deg, var(--dorado-claro), var(--dorado) 55%, var(--dorado-opaco));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:4px 0;
  }
  .subtitulo{
    font-size:.75rem;
    letter-spacing:4px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .subtitulo span{ color:var(--dorado); padding:0 10px; }

  /* ---------- CONTENT ---------- */
  .contenido{ max-width:1100px; margin:0 auto; padding:32px 20px 0; }
  .contenido h2{
    font-size:1rem; letter-spacing:2px; text-transform:uppercase;
    color:var(--dorado-claro); margin-bottom:2px; text-align:center;
  }
  .contenido p.sub{
    color:var(--muted); text-align:center; font-family:system-ui,sans-serif;
    font-size:.85rem; margin-top:0; margin-bottom:28px;
  }

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .card{
    background:linear-gradient(160deg, var(--verde-panel), #0f1e16);
    border:1px solid rgba(201,162,75,0.25);
    border-top:2px solid var(--linea, #555);
    border-radius:4px;
    padding:18px;
    position:relative;

    opacity:0;
    transform:translateY(22px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1),
               box-shadow .3s ease, border-color .3s ease;
  }
  .card.is-visible{ opacity:1; transform:translateY(0); }
  .card:hover{
    border-color:rgba(201,162,75,0.55);
    box-shadow:0 10px 28px rgba(0,0,0,0.35);
    transform:translateY(-3px);
  }
  .card.is-visible:hover{ transform:translateY(-3px); }

  .card.verde{ --linea:var(--al-dia); }
  .card.amarillo{ --linea:var(--leve); }
  .card.naranja{ --linea:var(--moderado); }
  .card.rojo{ --linea:var(--importante); }

  .nombre{
    font-family:system-ui,sans-serif;
    font-weight:600; margin-bottom:6px; font-size:.95rem; color:var(--text);
  }
  .estado{
    font-family:system-ui,sans-serif;
    font-size:.78rem; color:var(--muted); margin-bottom:12px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .barra-bg{background:rgba(255,255,255,0.06); border-radius:6px; height:6px; overflow:hidden;}
  .barra{
    height:100%; border-radius:6px; width:0;
    transition:width 1s cubic-bezier(.2,.8,.2,1) .15s;
  }
  .barra.verde{background:var(--al-dia);}
  .barra.amarillo{background:var(--leve);}
  .barra.naranja{background:var(--moderado);}
  .barra.rojo{background:var(--importante);}

  #loading{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;
  }
  #error{
    text-align:center; color:var(--muted); font-family:system-ui,sans-serif;
    padding:20px;
  }
  .skeleton{
    height:92px; border-radius:4px;
    border:1px solid rgba(201,162,75,0.15);
    background:linear-gradient(100deg, #142418 30%, #1c3123 50%, #142418 70%);
    background-size:220% 100%;
    animation:brillo 1.4s ease-in-out infinite;
  }
  @keyframes brillo{
    0%{ background-position:120% 0; }
    100%{ background-position:-20% 0; }
  }

  /* ---------- RESUMEN ---------- */
  .resumen{
    margin-top:40px;
    padding-top:28px;
    border-top:1px solid rgba(201,162,75,0.25);
  }
  .resumen h2{
    font-size:1rem; letter-spacing:2px; text-transform:uppercase;
    color:var(--dorado-claro); margin-bottom:22px; text-align:center;
  }
  .resumen-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:16px;
  }
  .resumen-card{
    background:linear-gradient(160deg, var(--verde-panel), #0f1e16);
    border:1px solid rgba(201,162,75,0.25);
    border-top:2px solid var(--linea, #555);
    border-radius:4px;
    padding:22px 18px;
    text-align:center;

    opacity:0;
    transform:translateY(22px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1),
               box-shadow .3s ease, border-color .3s ease;
  }
  .resumen-card.is-visible{ opacity:1; transform:translateY(0); }
  .resumen-card:hover{
    border-color:rgba(201,162,75,0.55);
    box-shadow:0 10px 28px rgba(0,0,0,0.35);
    transform:translateY(-3px);
  }
  .resumen-card.is-visible:hover{ transform:translateY(-3px); }
  .resumen-card.verde{ --linea:var(--al-dia); }
  .resumen-card.naranja{ --linea:var(--moderado); }
  .resumen-card.rojo{ --linea:var(--importante); }

  .resumen-pct{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:2.4rem;
    line-height:1;
  }
  .resumen-card.verde .resumen-pct{ color:var(--al-dia); }
  .resumen-card.naranja .resumen-pct{ color:var(--moderado); }
  .resumen-card.rojo .resumen-pct{ color:var(--importante); }

  .resumen-label{
    font-family:system-ui,sans-serif;
    font-size:.8rem; letter-spacing:1px; text-transform:uppercase;
    color:var(--text); margin-top:8px;
  }
  .resumen-detalle{
    font-family:system-ui,sans-serif;
    font-size:.72rem; color:var(--muted); margin-top:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .card, .resumen-card{ opacity:1; transform:none; }
    .barra{ width:var(--w, 0) !important; }
  }
</style>
</head>
<body>

<div class="hero">
  <img class="crest" src="https://res.cloudinary.com/dy9zeeo5g/image/upload/v1775063479/lbwk2ikigsjombr6nrmu.png" width="90" alt="Escudo Club Tilcara Legends">
</div>

<div class="contenido">
  <h2>Estado de Cuota Social | 14|07|2026</h2>
  <p class="sub">No se muestran montos ni fechas exactas.</p>

  <div id="loading">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div id="error" style="display:none;"></div>
  <div class="grid" id="grid"></div>

  <div class="resumen" id="resumen" style="display:none;">
    <h2>Resumen General</h2>
    <div class="resumen-grid">
      <div class="resumen-card verde">
        <div class="resumen-pct" id="pct-aldia">0%</div>
        <div class="resumen-label">Al día</div>
        <div class="resumen-detalle">Sin deuda o cuota corriente</div>
      </div>
      <div class="resumen-card naranja">
        <div class="resumen-pct" id="pct-moderado">0%</div>
        <div class="resumen-label">Atraso moderado</div>
        <div class="resumen-detalle">Debe al menos 2 cuotas</div>
      </div>
      <div class="resumen-card rojo">
        <div class="resumen-pct" id="pct-importante">0%</div>
        <div class="resumen-label">Atraso importante</div>
        <div class="resumen-detalle">Requiere atención</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Pegá acá la URL de tu Web App de Apps Script (termina en /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbPnNjcWdnwzgWBx-OP3hXq7Z7lEVrTapWfVzgSpeK04N5NfeFlsXd8a5ZVBHoqP4m-Q/exec';

  async function cargar() {
    try {
      // GET simple, sin headers custom -> evita problemas de CORS/preflight
      const res = await fetch(APPS_SCRIPT_URL + '?categoria=VETERANOS-%20RUGBY');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const datos = await res.json();
      renderizar(datos);
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = 'No se pudo cargar el padrón: ' + err.message;
    }
  }

  function renderizar(datos) {
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    datos.forEach((d, i) => {
      const card = document.createElement('div');
      card.className = 'card ' + d.color;
      card.style.transitionDelay = Math.min(i * 45, 500) + 'ms';
      card.innerHTML = `
        <div class="nombre">${d.nombre}</div>
        <div class="estado">${d.estado}</div>
        <div class="barra-bg"><div class="barra ${d.color}" style="--w:${d.score}%"></div></div>
      `;
      grid.appendChild(card);
      observarReveal(card, () => {
        card.querySelector('.barra').style.width = d.score + '%';
      });
    });

    mostrarResumen(datos);
  }

  // Dispara la animación de entrada (fade + slide) cuando el elemento
  // entra en el viewport, con un callback opcional para animar contenido interno.
  function observarReveal(el, onVisible) {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          if (onVisible) onVisible();
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    obs.observe(el);
  }

  // Anima un número de 0 hasta el valor final (ej. "62%")
  function contarHasta(el, valorFinal, duracionMs = 900) {
    const destino = parseInt(valorFinal, 10) || 0;
    const inicio = performance.now();
    function paso(ahora) {
      const t = Math.min((ahora - inicio) / duracionMs, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(destino * ease) + '%';
      if (t < 1) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  }

  function mostrarResumen(datos) {
    const total = datos.length;
    if (total === 0) return;

    // "Al día" unifica verde (al día) y amarillo (atraso leve)
    const aldia = datos.filter(d => d.color === 'verde' || d.color === 'amarillo').length;
    const moderado = datos.filter(d => d.color === 'naranja').length;
    const importante = datos.filter(d => d.color === 'rojo').length;

    const pct = n => Math.round((n / total) * 100) + '%';

    const resumen = document.getElementById('resumen');
    resumen.style.display = 'block';

    const tarjetas = [
      { el: document.getElementById('pct-aldia'), valor: pct(aldia) },
      { el: document.getElementById('pct-moderado'), valor: pct(moderado) },
      { el: document.getElementById('pct-importante'), valor: pct(importante) },
    ];

    tarjetas.forEach(({ el, valor }) => {
      const card = el.closest('.resumen-card');
      observarReveal(card, () => contarHasta(el, valor));
    });
  }

  cargar();
</script>
</body>
</html>
